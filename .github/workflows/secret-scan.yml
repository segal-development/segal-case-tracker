name: secret-scan

# Fails the build if a secret (password, API key, token, private key) is
# detected in the repository or a PR diff — prevents credentials from ever
# being committed. Uses the gitleaks binary directly (no org license needed).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so historical leaks are caught too

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository for secrets
        run: gitleaks detect --source . --redact --verbose --exit-code 1
