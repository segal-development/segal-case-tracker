name: Deploy QA

# Test gate on every push/PR; deploy to the QA VM only on push to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run tests (unit, no integration)
        run: poetry run pytest -m "not integration" -q

      - name: Type-check core
        run: poetry run mypy app/core

  deploy:
    # Only deploy real pushes to main, after tests pass. Never on PRs.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-qa
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git archive main` works

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.QA_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.QA_VM_IP }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build archive and deploy to QA VM
        env:
          VM_IP: ${{ secrets.QA_VM_IP }}
          VM_USER: ${{ secrets.QA_VM_USER }}
        run: |
          set -euo pipefail
          git archive --format=tar.gz -o /tmp/casetracker-qa.tar.gz main
          scp -i ~/.ssh/id_deploy /tmp/casetracker-qa.tar.gz "$VM_USER@$VM_IP:~/casetracker-qa.tar.gz"
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_IP" '
            set -e
            cd ~/casetracker
            tar xzf ~/casetracker-qa.tar.gz
            sudo docker compose -f docker-compose.qa.yml up -d --build
            sudo docker compose -f docker-compose.qa.yml ps
          '

      - name: Health check
        env:
          VM_IP: ${{ secrets.QA_VM_IP }}
        run: |
          sleep 10
          curl -fsS "http://$VM_IP:8000/health" && echo "" && echo "QA healthy"
