name: Deploy QA

# Test gate on every push/PR; deploy to the QA VM only on push to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run tests (unit, no integration)
        run: poetry run pytest -m "not integration" -q

      - name: Type-check core
        run: poetry run mypy app/core

  deploy:
    # Only deploy real pushes to main, after tests pass. Never on PRs.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-qa
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git archive main` works

      # El job `test` tarda varios minutos y corre ANTES de tomar el lock de
      # `deploy-qa`, asi que dos corridas pueden llegar a la cola en orden
      # distinto al de los commits. Paso de verdad el 29-09-2026: el deploy de
      # acff50b (commit viejo) termino 13 minutos DESPUES del de f1ff53e y dejo
      # QA corriendo codigo anterior. Las dos corridas quedaron en verde y los
      # dos health checks dijeron la verdad en su momento, porque cada uno
      # verifica su propio commit al final de su propia corrida.
      #
      # No se usa `cancel-in-progress: true` a proposito: cancelar un deploy a
      # mitad de un `docker compose up --build` puede dejar la VM con
      # contenedores a medio construir. Un deploy obsoleto se descarta solo.
      - name: Descartar el deploy si ya no es la punta de main
        id: vigencia
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          PUNTA=$(git rev-parse origin/main)
          if [ "$PUNTA" = "$GITHUB_SHA" ]; then
            echo "vigente=true" >> "$GITHUB_OUTPUT"
            echo "Este commit (${GITHUB_SHA:0:7}) es la punta de main: se despliega."
          else
            echo "vigente=false" >> "$GITHUB_OUTPUT"
            echo "Obsoleto: main ya esta en ${PUNTA:0:7} y esta corrida es ${GITHUB_SHA:0:7}."
            echo "Se descarta para no pisar QA con codigo viejo; la corrida de ${PUNTA:0:7} lo despliega."
          fi

      - name: Configure SSH
        if: steps.vigencia.outputs.vigente == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.QA_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.QA_VM_IP }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build archive and deploy to QA VM
        if: steps.vigencia.outputs.vigente == 'true'
        env:
          VM_IP: ${{ secrets.QA_VM_IP }}
          VM_USER: ${{ secrets.QA_VM_USER }}
        run: |
          set -euo pipefail
          # Se empaqueta el SHA que disparó esta corrida y NO la rama `main`.
          # Con `main`, cada corrida armaba el paquete desde lo que esa rama
          # apuntara en su runner: con varios deploys en cola, el que terminaba
          # último ganaba aunque fuera el más viejo. El 28-09-2026 eso desplegó
          # un commit anterior encima del nuevo y el workflow lo reportó en
          # verde, porque efectivamente había desplegado algo.
          git archive --format=tar.gz -o /tmp/casetracker-qa.tar.gz "$GITHUB_SHA"
          scp -i ~/.ssh/id_deploy /tmp/casetracker-qa.tar.gz "$VM_USER@$VM_IP:~/casetracker-qa.tar.gz"
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_IP" "
            set -e
            cd ~/casetracker
            tar xzf ~/casetracker-qa.tar.gz
            export APP_COMMIT='$GITHUB_SHA'
            sudo -E docker compose -f docker-compose.qa.yml up -d --build
            sudo docker compose -f docker-compose.qa.yml ps
          "

      - name: Health check
        if: steps.vigencia.outputs.vigente == 'true'
        env:
          VM_IP: ${{ secrets.QA_VM_IP }}
        run: |
          # Se espera a que la app responda Y a que el commit que reporta sea
          # el que se quiso desplegar. Antes solo se consultaba /readyz, que
          # contesta igual de bien con codigo de la semana pasada: por eso un
          # deploy que subio el commit equivocado quedo en verde.
          for i in $(seq 1 24); do
            if curl -fsS "http://$VM_IP:8000/readyz" >/dev/null 2>&1; then
              CORRIENDO=$(curl -fsS "http://$VM_IP:8000/health" | jq -r '.commit // "desconocido"')
              if [ "$CORRIENDO" = "$GITHUB_SHA" ]; then
                echo "QA corriendo ${GITHUB_SHA:0:7} — desplegado y verificado (~$((i * 5))s)"
                exit 0
              fi
              echo "  responde, pero corre ${CORRIENDO:0:7} y se esperaba ${GITHUB_SHA:0:7}..."
            else
              echo "  esperando que QA levante... (~$((i * 5))s)"
            fi
            sleep 5
          done
          echo "QA no quedo corriendo $GITHUB_SHA dentro de 120s" >&2
          echo "Reporta: $(curl -fsS "http://$VM_IP:8000/health" || echo 'sin respuesta')" >&2
          exit 1
