# QA overlay — GCE + Cloud SQL Auth Proxy
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.qa.yml up -d
#
# Prerequisites:
#   - .env.qa file present (copy from .env.qa.example and fill in secrets)
#   - Service account JSON placed at the path set in GOOGLE_APPLICATION_CREDENTIALS_PATH
#
# This overlay:
#   - Disables the local postgres container (replaced by Cloud SQL Auth Proxy)
#   - Adds cloud-sql-proxy and migrate services
#   - Overrides api/worker to use Cloud SQL, GCS, and production-grade settings

version: '3.8'

services:

  # --------------------------------------------------------------------------
  # Disable local postgres — Cloud SQL Auth Proxy is the DB gateway in QA
  # --------------------------------------------------------------------------
  postgres:
    profiles:
      - dev-only   # never active in QA; postgres container will not start

  # --------------------------------------------------------------------------
  # Cloud SQL Auth Proxy v2
  # Listens on 0.0.0.0:5432 so other containers can reach it by service name.
  # --------------------------------------------------------------------------
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${CLOUD_SQL_INSTANCE_CONNECTION_NAME}"
    volumes:
      - type: bind
        source: "${GOOGLE_APPLICATION_CREDENTIALS_PATH}"
        target: /secrets/sa-key.json
        read_only: true
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/sa-key.json
    env_file: .env.qa
    restart: unless-stopped
    networks:
      - default

  # --------------------------------------------------------------------------
  # One-shot migration runner — exits 0 on success, restarts on failure
  # --------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "-c", "alembic/alembic.ini", "upgrade", "head"]
    env_file: .env.qa
    environment:
      - DATABASE_URL=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@cloud-sql-proxy:5432/${DB_NAME}
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      - cloud-sql-proxy
    restart: on-failure

  # --------------------------------------------------------------------------
  # Redis — same image as dev, explicit here so the overlay is self-contained
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # API — production settings, GCS storage, Cloud SQL via proxy
  # --------------------------------------------------------------------------
  api:
    env_file: .env.qa
    environment:
      # Database — points at Cloud SQL Auth Proxy (service DNS name)
      - DATABASE_URL=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@cloud-sql-proxy:5432/${DB_NAME}
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # GCS document storage
      - DOC_STORAGE_BACKEND=gcs
      - GCS_BUCKET=${GCS_BUCKET}
      - DOC_DOWNLOAD_ENABLED=true
      # Auth / security
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS}
      # App
      - APP_URL=${BASE_URL}
      - ENVIRONMENT=production
      - DEBUG=false
      - ENABLE_SCHEDULER=false
      # 2Captcha
      - CAPTCHA_API_KEY=${CAPTCHA_API_KEY}
      # Email
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      # Worker tuning (consumed by Settings even from API container)
      - SYNC_INTERVAL_HOURS=${SYNC_INTERVAL_HOURS:-4}
      - MAX_DATA_AGE_HOURS=${MAX_DATA_AGE_HOURS:-4}
    depends_on:
      cloud-sql-proxy:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    # Remove dev-only volume mount (no hot-reload in QA)
    volumes: []
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Worker — same env as API plus scheduler enabled, larger shm for Chromium
  # --------------------------------------------------------------------------
  worker:
    env_file: .env.qa
    environment:
      # Database
      - DATABASE_URL=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@cloud-sql-proxy:5432/${DB_NAME}
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # GCS
      - DOC_STORAGE_BACKEND=gcs
      - GCS_BUCKET=${GCS_BUCKET}
      - DOC_DOWNLOAD_ENABLED=true
      # Auth / security
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # CORS (needed for Settings validation in production mode)
      - CORS_ORIGINS=${CORS_ORIGINS}
      # App
      - APP_URL=${BASE_URL}
      - ENVIRONMENT=production
      - DEBUG=false
      # Scheduler ON in worker
      - ENABLE_SCHEDULER=true
      # 2Captcha
      - CAPTCHA_API_KEY=${CAPTCHA_API_KEY}
      # Email
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      # Worker tuning
      - SYNC_INTERVAL_HOURS=${SYNC_INTERVAL_HOURS:-4}
      - MAX_DATA_AGE_HOURS=${MAX_DATA_AGE_HOURS:-4}
    depends_on:
      cloud-sql-proxy:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    shm_size: 2gb
    restart: unless-stopped

networks:
  default:
    driver: bridge
